name: Process Articles

on:
  schedule:
    - cron: '47 */3 * * *'  # Every 3 hours at :47 — safety net cron
  workflow_dispatch:
    inputs:
      job_budget_minutes:
        description: 'Wall-clock budget in minutes for the drain loop (default 180)'
        required: false
        default: '180'
      reprocess_batch_size:
        description: 'Fallback reprocess batch size (default 50)'
        required: false
        default: '50'
  # Event-driven trigger: pick up new articles the moment Crawl Sources
  # finishes. Reduces "process is waiting for the next 3h cron" lag from
  # up to 3 hours down to ~0 seconds. The cron above stays as a backup
  # in case the workflow_run trigger ever misfires.
  workflow_run:
    workflows: ["Crawl Sources"]
    types: [completed]
    branches: [master]

concurrency:
  group: process-articles
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # When triggered by workflow_run, only proceed if the upstream Crawl
    # Sources run actually succeeded. A cancelled/failed crawl shouldn't
    # spawn a process pass.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # GH job timeout — script's internal drain loop stops ~5min before
    # this hits so cleanup + job_runs write finish gracefully.
    timeout-minutes: ${{ fromJSON(inputs.job_budget_minutes || '180') }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_MODEL_CHAIN: ${{ secrets.LLM_MODEL_CHAIN }}
      JOB_BUDGET_MINUTES: ${{ inputs.job_budget_minutes || '180' }}
      REPROCESS_BATCH_SIZE: ${{ inputs.reprocess_batch_size || '50' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund
      - run: npx tsx scripts/process.ts
